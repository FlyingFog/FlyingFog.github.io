<div class="home">
    <div class="info">
        <div class="intro">
            <h1>{{ .Site.Params.author }}</h1>
        <p>
            <small>- {{ .Params.phd }}</small>
        </p>
        <p><small>- {{ .Params.bs }}</small></p>    
        </div>

        {{ if .Site.Params.avatarURL }}
        {{ with .Site.Params.avatarURL }}
        <div class="avatar">
            <span class="avatar-hint" id="avatar-hint" aria-live="polite"></span>
            <button class="avatar-button" id="avatar-button" type="button" aria-label="Show alternate portrait" aria-pressed="false">
                <img id="avatar" src="{{ . | relURL }}" alt="Portrait of {{ $.Site.Params.author }}">
            </button>
        </div>
        {{ end }}
        {{ end }}
    </div>

    <section class="blog-content">{{ .Content }}</section>



    {{ with .Params.mottos }}
    <div class="motto-container">
      <button class="motto" id="motto" type="button" aria-label="Show another motto" title="Click for another motto">
        <small id="motto-text" aria-live="polite"></small>
      </button>
    </div>
    <script>
        const mottos = {{ . | jsonify | safeJS }};
        const mottoText = document.getElementById('motto-text');
        let currentMottoIndex = -1;

        function showRandomMotto() {
            let nextMottoIndex = Math.floor(Math.random() * mottos.length);
            if (mottos.length > 1) {
                while (nextMottoIndex === currentMottoIndex) {
                    nextMottoIndex = Math.floor(Math.random() * mottos.length);
                }
            }
            currentMottoIndex = nextMottoIndex;
            mottoText.textContent = mottos[currentMottoIndex];
        }

        document.getElementById('motto').addEventListener('click', showRandomMotto);
        showRandomMotto();
    </script>
    {{ end }}
    
    <script>
        (() => {
            const avatar = document.getElementById('avatar');
            const avatarButton = document.getElementById('avatar-button');
            const avatarHint = document.getElementById('avatar-hint');
            const avatarURL1 = "{{ .Site.Params.avatarURL | relURL }}";
            const avatarURL2 = "{{ .Site.Params.avatarURL2 | relURL }}";
            let alternateAvatarVisible = false;
            let cursorTimer;
            let hintTimer;

            if (!avatar || !avatarButton || !avatarHint || !avatarURL2) return;

            avatarButton.addEventListener('click', () => {
                alternateAvatarVisible = !alternateAvatarVisible;
                avatar.src = alternateAvatarVisible ? avatarURL2 : avatarURL1;
                avatarButton.setAttribute('aria-pressed', String(alternateAvatarVisible));
                avatarButton.setAttribute(
                    'aria-label',
                    alternateAvatarVisible ? 'Restore primary portrait' : 'Show alternate portrait'
                );

                clearTimeout(cursorTimer);
                clearTimeout(hintTimer);
                avatarHint.classList.remove('is-visible');
                void avatarHint.offsetWidth;
                avatarHint.textContent = alternateAvatarVisible ? 'You Found Me!' : 'Bye~';
                avatarHint.classList.add('is-visible');

                hintTimer = setTimeout(() => {
                    avatarHint.classList.remove('is-visible');
                }, 1000);

                cursorTimer = setTimeout(() => {
                    document.documentElement.classList.toggle(
                        'star-cursor-active',
                        alternateAvatarVisible
                    );
                }, 1000);
            });
        })();
    </script>

</div>
